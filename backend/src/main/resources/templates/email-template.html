<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>أُنس | {{subject}}</title>
</head>

<body dir="rtl"
      style="margin:0;padding:0;background-color:#f5f3ed;
             font-family:Tahoma,Arial,sans-serif;color:#153f33;">

<div style="display:none;font-size:1px;line-height:1px;
            max-height:0;max-width:0;opacity:0;
            overflow:hidden;mso-hide:all;">
  {{subject}}
</div>

<table role="presentation" width="100%"
       cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f5f3ed;">
  <tr>
    <td align="center" style="padding:32px 12px;">

      <!--[if mso]>
      <table role="presentation" width="600" align="center">
        <tr><td>
      <![endif]-->

      <table role="presentation" width="100%"
             cellpadding="0" cellspacing="0" border="0"
             style="width:100%;max-width:600px;
                    background-color:#ffffff;
                    border:1px solid #e7dfcf;
                    border-top:5px solid #c69a4c;
                    border-radius:16px;">

        <tr>
          <td align="center" style="padding:28px 24px 20px;">
            <img src="{{logoUrl}}"
                 alt="أُنس — ضيوف الرحمن، لكم من القلب أُنس ومنا اهتمام"
                 width="260"
                 style="display:block;width:100%;
                        max-width:260px;height:auto;border:0;">
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:0 24px 24px;">
            <table role="presentation"
                   cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:8px 18px;
                           background-color:#edf4ef;
                           border-radius:20px;
                           color:#07523e;font-size:12px;
                           font-weight:bold;">
                  إشعار من نظام أُنس
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="right" dir="rtl"
              style="padding:0 28px 18px;">

            <h1 style="margin:0 0 16px;font-size:24px;
                       line-height:1.7;color:#07523e;">
              {{subject}}
            </h1>

            <p style="margin:0;font-size:15px;
                      line-height:1.9;color:#43584e;">
              السلام عليكم ورحمة الله وبركاته،
            </p>
          </td>
        </tr>

        <tr>
          <td style="padding:0 28px 30px;">
            <table role="presentation" width="100%"
                   cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#faf8f2;
                          border:1px solid #ece3d1;
                          border-right:4px solid #c69a4c;
                          border-radius:10px;">
              <tr>
                <td align="right" dir="rtl"
                    style="padding:22px;font-size:15px;
                           line-height:2;color:#344e42;
                           white-space:pre-line;
                           overflow-wrap:anywhere;">{{message}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" dir="rtl"
              style="padding:22px 24px;
                     background-color:#f0f5f1;
                     border-top:1px solid #e1e9df;">

            <p style="margin:0 0 8px;font-size:15px;
                      line-height:1.8;font-weight:bold;
                      color:#07523e;">
              معكم، لتصلوا بطمأنينة
            </p>

            <p style="margin:0;font-size:12px;
                      line-height:1.9;color:#65776b;">
              يرجى متابعة التفاصيل عبر نظام أُنس.
              <br>
              هذه رسالة آلية، يرجى عدم الرد عليها.
            </p>
          </td>
        </tr>

      </table>

      <!--[if mso]>
      </td></tr>
      </table>
      <![endif]-->

      <p style="margin:18px 0 0;text-align:center;
                font-size:11px;line-height:1.8;color:#778074;">
        أُنس · رعاية واهتمام بضيوف الرحمن
      </p>

    </td>
  </tr>
</table>

</body>
</html>
